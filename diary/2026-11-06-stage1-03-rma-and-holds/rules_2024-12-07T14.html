<script>
(() => {
  const S = JSON.parse(document.getElementById('session').textContent);
  const M = S.map, frames = S.frames, events = S.events;
  const params = new URLSearchParams(location.search);
  const fullTrail = params.get('trail') === 'all', trailLen = Number(params.get('trail')) || 10;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {};
  ['--ring','--map','--rma','--smaa','--runway','--centreline','--fix','--hold','--vectoring','--established','--goaround','--held','--text','--muted'].forEach(k => C[k] = css(k));
  const duration = Math.max(S.meta.duration || 0, frames.length ? frames[frames.length - 1].t : 0, 1);

  document.title = S.meta.title || 'Radar replay';
  document.getElementById('title').textContent = S.meta.title || 'Radar replay';
  document.getElementById('subtitle').textContent = [S.meta.scenario, S.meta.controller, M.airport + ' ' + M.runway, S.meta.milestone].filter(Boolean).join(' · ');
  document.getElementById('banner').textContent = M.name + ' · runway ' + M.runway + (S.meta.code_version ? ' · code ' + S.meta.code_version : '');

  // Wind (real weather), as direction it blows from in degrees true and speed in knots
  if (S.meta.weather) {
    const w = S.meta.weather, box = document.getElementById('wind');
    const rows = w.levels.map(l => '<tr><td>' + (l.alt === 'surface' ? 'surface' : l.alt.toLocaleString('en-GB') + ' ft') +
      '</td><td><span class="arrow" style="transform:rotate(' + l.dir + 'deg)">↓</span></td><td>' +
      String(l.dir).padStart(3, '0') + '°</td><td>' + l.kt + ' kt</td></tr>').join('');
    box.innerHTML = '<b>Wind</b> ' + w.valid.replace('T', ' ').replace(':00Z', 'Z') + '<table>' + rows + '</table>' +
      '<div style="margin-top:3px">' + w.source.replace(/, run.*/, '') + '</div>';
    box.style.display = 'block';
  }

  if ((S.ghosts || []).length) {
    document.getElementById('legend').insertAdjacentHTML('beforeend',
      '<span style="background:var(--real)"></span>real, before handover<span style="background:var(--ghost)"></span>real track after handover');
  }

  // Scores table
  const st = document.getElementById('scoretable');
  const labels = (S.meta && S.meta.scores_labels) || {};
  Object.entries(S.scores || {}).forEach(([k, v]) => {
    if (typeof v === 'object' || v === '' || v === null) return;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td>';
    tr.children[0].textContent = (labels[k] || k.replace(/_/g, ' '));
    tr.children[1].textContent = typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : String(v);
    st.appendChild(tr);
  });
  if (!st.children.length) document.getElementById('scores').style.display = 'none';

  // View
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const pts = [[0, 0], M.active.threshold].concat(M.holds.map(h => h.xy));
  const c26 = M.active.course_true * Math.PI / 180;
  pts.push([M.active.threshold[0] - 20 * Math.sin(c26), M.active.threshold[1] - 20 * Math.cos(c26)]);
  let xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) + 14;
  let zoom = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    zoom = zoom === 1 ? Math.min(W, H) / span : zoom;
  }
  const sx = x => W / 2 + (x - cx) * zoom, sy = y => H / 2 - (y - cy) * zoom;
  window.addEventListener('resize', () => { const z = zoom; resize(); zoom = z; draw(); });
  let drag = null;
  canvas.addEventListener('mousedown', e => drag = [e.clientX, e.clientY, cx, cy]);
  window.addEventListener('mouseup', () => drag = null);
  window.addEventListener('mousemove', e => { if (!drag) return; cx = drag[2] - (e.clientX - drag[0]) / zoom; cy = drag[3] + (e.clientY - drag[1]) / zoom; draw(); });
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoom *= e.deltaY < 0 ? 1.15 : 1 / 1.15; draw(); }, { passive: false });

  function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(sx(x0), sy(y0)); ctx.lineTo(sx(x1), sy(y1)); ctx.stroke(); }

  function drawMap() {
    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    // Range rings around the airport
    ctx.strokeStyle = C['--ring']; ctx.lineWidth = 1; ctx.fillStyle = C['--muted'];
    [10, 20, 30, 40].forEach(r => { ctx.beginPath(); ctx.arc(sx(0), sy(0), r * zoom, 0, 2 * Math.PI); ctx.stroke(); ctx.fillText(r + ' NM', sx(0) + 4, sy(r) - 3); });
    // Airspace
    Object.entries(M.airspace).forEach(([name, segs]) => {
      ctx.strokeStyle = /SMAA/.test(name) ? C['--smaa'] : C['--rma']; ctx.lineWidth = 1;
      segs.forEach(s => line(s[0], s[1], s[2], s[3]));
    });
    // Extended centreline with a tick every mile, longer every 5
    const t = M.active.threshold, c = M.active.course_true * Math.PI / 180;
    const ux = -Math.sin(c), uy = -Math.cos(c), px = Math.cos(c), py = -Math.sin(c);
    ctx.strokeStyle = C['--centreline']; ctx.setLineDash([6, 6]); line(t[0], t[1], t[0] + 20 * ux, t[1] + 20 * uy); ctx.setLineDash([]);
    for (let d = 1; d <= 20; d++) { const k = d % 5 ? 0.25 : 0.6; line(t[0] + d * ux - k * px, t[1] + d * uy - k * py, t[0] + d * ux + k * px, t[1] + d * uy + k * py); }
    // Runways
    ctx.strokeStyle = C['--runway']; ctx.lineWidth = 3;
    const byName = Object.fromEntries(M.runways.map(r => [r.name, r]));
    if (byName['26L'] && byName['08R']) line(byName['26L'].threshold[0], byName['26L'].threshold[1], byName['08R'].threshold[0], byName['08R'].threshold[1]);
    ctx.lineWidth = 1;
    // Holds as racetracks: one-minute inbound leg ending at the fix
    ctx.strokeStyle = C['--hold'];
    M.holds.forEach(h => {
      const ib = h.inbound_true * Math.PI / 180, leg = 3.7, r = 1.5, side = h.turn === 'right' ? 1 : -1;
      const fx = h.xy[0], fy = h.xy[1];
      const bx = fx - leg * Math.sin(ib), by = fy - leg * Math.cos(ib);           // start of the inbound leg
      const ox = 2 * r * Math.cos(ib) * side, oy = -2 * r * Math.sin(ib) * side;  // offset to the outbound leg
      line(bx, by, fx, fy); line(bx + ox, by + oy, fx + ox, fy + oy);
      // Turn at the fix onto the outbound leg, and at the far end back onto the inbound leg.
      [[fx, fy, fx + ox / 2, fy + oy / 2], [bx + ox, by + oy, bx + ox / 2, by + oy / 2]].forEach(([x, y, mx, my]) => {
        ctx.beginPath();
        const start = Math.atan2(-(y - my), x - mx);
        ctx.arc(sx(mx), sy(my), r * zoom, start, start + Math.PI * side, side < 0);
        ctx.stroke();
      });
    });
    // Fixes
    ctx.fillStyle = C['--fix']; ctx.strokeStyle = C['--fix'];
    M.fixes.forEach(f => {
      const x = sx(f.xy[0]), y = sy(f.xy[1]);
      ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + 4, y + 3); ctx.lineTo(x - 4, y + 3); ctx.closePath(); ctx.stroke();
      ctx.fillText(f.name, x + 6, y + 4);
    });
    ctx.fillStyle = C['--runway']; ctx.fillText(M.airport, sx(0) + 6, sy(0) - 8);
  }

  // Frames
  function frameIndex(t) {
    let lo = 0, hi = frames.length - 1;
    if (hi < 0 || t < frames[0].t) return -1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (frames[mid].t <= t) lo = mid; else hi = mid - 1; }
    return lo;
  }
  function aircraftAt(t) {
    const i = frameIndex(t); if (i < 0) return [];
    const a = frames[i], b = frames[Math.min(i + 1, frames.length - 1)];
    const f = b.t > a.t ? Math.min(1, (t - a.t) / (b.t - a.t)) : 0;
    const next = Object.fromEntries(b.ac.map(p => [p.cs, p]));
    return a.ac.map(p => {
      const q = next[p.cs]; if (!q) return p;
      return Object.assign({}, p, { x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f, alt: p.alt + (q.alt - p.alt) * f, cas: p.cas + (q.cas - p.cas) * f });
    });
  }
  const colour = ph => ph === 'established' || ph === 'final' ? C['--established'] : ph === 'go_around' ? C['--goaround'] : ph === 'holding' ? C['--held'] : C['--vectoring'];

  // Real tracks (real-traffic sessions): white while the aircraft is still with the real controllers,
  // then a faint grey line showing what really happened after we took it over.
  const ghosts = S.ghosts || [];
  function ghostAt(g, t) {
    const P = g.points; if (!P.length || t < P[0][0] || t > P[P.length - 1][0]) return null;
    let lo = 0, hi = P.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (P[mid][0] <= t) lo = mid; else hi = mid - 1; }
    const a = P[lo], b = P[Math.min(lo + 1, P.length - 1)], f = b[0] > a[0] ? (t - a[0]) / (b[0] - a[0]) : 0;
    return { x: a[1] + (b[1] - a[1]) * f, y: a[2] + (b[2] - a[2]) * f, alt: a[3] + (b[3] - a[3]) * f, k: lo };
  }
  function drawGhosts(t) {
    ghosts.forEach(g => {
      const now = ghostAt(g, t);
      const P = g.points;
      const upto = now ? now.k : (t > (P.length ? P[P.length - 1][0] : 0) ? P.length - 1 : -1);
      if (upto < 0) return;
      if (t < g.handover_t) {
        // Still with the real controllers: a white target with its callsign.
        if (!now) return;
        ctx.globalAlpha = 0.5; ctx.fillStyle = C['--real'];
        for (let k = Math.max(0, upto - 6); k <= upto; k++) ctx.fillRect(sx(P[k][1]) - 1, sy(P[k][2]) - 1, 2, 2);
        ctx.globalAlpha = 0.9;
        ctx.fillRect(sx(now.x) - 3, sy(now.y) - 3, 6, 6);
        ctx.fillText(g.cs, sx(now.x) + 8, sy(now.y) - 6);
        ctx.globalAlpha = 1;
        return;
      }
      // Ours now: the real track from the handover on, in faint grey.
      let k0 = 0; while (k0 < P.length && P[k0][0] < g.handover_t) k0++;
      ctx.strokeStyle = C['--ghost']; ctx.globalAlpha = 0.45; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = k0; k <= upto; k++) { const X = sx(P[k][1]), Y = sy(P[k][2]); k === k0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); }
      if (now) ctx.lineTo(sx(now.x), sy(now.y));
      ctx.stroke();
      if (now) {
        ctx.fillStyle = C['--ghost']; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(sx(now.x), sy(now.y), 2.5, 0, 2 * Math.PI); ctx.fill();
        ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillText(g.cs, sx(now.x) + 5, sy(now.y) + 11);
        ctx.font = '11.5px ui-monospace, Menlo, Consolas, monospace';
      }
      ctx.globalAlpha = 1;
    });
  }

  function drawAircraft(t) {
    const i = frameIndex(t);
    ctx.font = '11.5px ui-monospace, Menlo, Consolas, monospace';
    if (ghosts.length) drawGhosts(t);
    if (fullTrail && i >= 0) {
      // Every aircraft's whole track so far, including ones that have landed, coloured by phase.
      const tracks = {}, lastSeen = {};
      for (let k = 0; k <= i; k++) frames[k].ac.forEach(a => { (tracks[a.cs] = tracks[a.cs] || []).push(a); lastSeen[a.cs] = frames[k].t; });
      ctx.lineWidth = 1.5; ctx.globalAlpha = 0.55;
      const flying = new Set(aircraftAt(t).map(a => a.cs));
      const landed = [];
      Object.values(tracks).forEach(pts => {
        for (let k = 1; k < pts.length; k++) {
          ctx.strokeStyle = colour(pts[k].phase);
          line(pts[k - 1].x, pts[k - 1].y, pts[k].x, pts[k].y);
        }
        const last = pts[pts.length - 1];
        if (!flying.has(last.cs)) landed.push(last);
      });
      // Aircraft that have landed: one stacked label list below the runway, in landing order.
      if (landed.length) {
        landed.sort((a, b) => lastSeen[a.cs] - lastSeen[b.cs]);
        const t0 = M.active.threshold;
        ctx.globalAlpha = 0.9; ctx.fillStyle = C['--muted'];
        landed.forEach((a, k) => ctx.fillText((k === 0 ? 'landed: ' : '        ') + a.cs, sx(t0[0]) + 6, sy(t0[1]) + 18 + 14 * k));
      }
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
    aircraftAt(t).forEach(p => {
      const col = colour(p.phase);
      // Trail: dots for recent positions; with ?trail=all the whole track as a faint line
      ctx.fillStyle = col; ctx.globalAlpha = 0.45;
      for (let k = 1; k <= trailLen && i - k >= 0; k++) {
        const q = frames[i - k].ac.find(a => a.cs === p.cs); if (!q) break;
        ctx.fillRect(sx(q.x) - 1.5, sy(q.y) - 1.5, 3, 3);
      }
      ctx.globalAlpha = 1;
      const x = sx(p.x), y = sy(p.y);
      // One-minute leader line along the heading
      const h = p.hdg * Math.PI / 180, d = (p.gs || p.cas) / 60;
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      line(p.x, p.y, p.x + d * Math.sin(h), p.y + d * Math.cos(h));
      ctx.fillStyle = col; ctx.fillRect(x - 4, y - 4, 8, 8);
      // Data block
      const lx = x + 14, ly = y - 18;
      ctx.beginPath(); ctx.moveTo(x + 4, y - 4); ctx.lineTo(lx - 2, ly + 6); ctx.stroke();
      ctx.fillText(p.cs, lx, ly);
      const alt = p.alt >= 6000 ? 'F' + String(Math.round(p.alt / 100)).padStart(3, '0') : 'A' + String(Math.round(p.alt / 100)).padStart(3, '0');
      ctx.fillText(alt + ' ' + String(Math.round(p.cas / 10)).padStart(2, '0'), lx, ly + 13);
      ctx.fillText(p.type + ' ' + (p.wake || ''), lx, ly + 26);
    });
  }

  let t = 0, playing = false, speed = Number(params.get('speed') || 10), last = null;
  document.getElementById('speed').value = String([1, 5, 10, 30, 60].includes(speed) ? speed : 10);
  const tr = document.getElementById('transcript'), slider = document.getElementById('slider'), clock = document.getElementById('clock');
  let shown = 0;
  function fmt(s) { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
  function utc(s) { const d = new Date(s * 1000); return d.toISOString().slice(11, 19); }
  function updateTranscript() {
    const upto = events.filter(e => e.t <= t).length;
    if (upto < shown) { tr.innerHTML = ''; shown = 0; }
    for (; shown < upto; shown++) {
      const e = events[shown], div = document.createElement('div');
      div.className = 'ev ' + ({ blocked: 'blocked', landed: 'landed', go_around: 'goaround', separation_loss: 'loss', note: 'note', takeover: 'takeover' }[e.kind] || '');
      const span = document.createElement('span'); span.className = 't'; span.textContent = S.meta.t0_epoch ? utc(S.meta.t0_epoch + e.t).slice(0, 5) : fmt(e.t);
      div.appendChild(span); div.appendChild(document.createTextNode(e.text));
      tr.appendChild(div);
    }
    tr.scrollTop = tr.scrollHeight;
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, W, H);
    drawMap(); drawAircraft(t);
    clock.textContent = S.meta.t0_epoch ? utc(S.meta.t0_epoch + t) + ' UTC' : fmt(t) + ' / ' + fmt(duration);
    slider.value = String(Math.round(1000 * t / duration));
    updateTranscript();
  }
  function tick(now) {
    if (playing) {
      if (last !== null) t = Math.min(duration, t + (now - last) / 1000 * speed);
      last = now;
      if (t >= duration) { playing = false; document.getElementById('play').textContent = 'Play'; window.replayDone = true; }
    }
    draw();
    requestAnimationFrame(tick);
  }
  document.getElementById('play').onclick = () => { if (t >= duration) t = 0; playing = !playing; last = null; document.getElementById('play').textContent = playing ? 'Pause' : 'Play'; };
  document.getElementById('speed').onchange = e => speed = Number(e.target.value);
  slider.oninput = () => { t = duration * Number(slider.value) / 1000; };
  resize();
  if (params.get('autoplay') === '1') { setTimeout(() => { playing = true; last = null; document.getElementById('play').textContent = 'Pause'; }, Number(params.get('delay') || 800)); }
  window.replayDuration = duration;
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
